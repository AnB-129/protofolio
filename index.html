<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joel — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     EDIT-FRIENDLY DATA LIVES IN THE <script> BLOCK AT THE BOTTOM.
     Look for "const CONFIG = {" — ganti foto, nama, username,
     dan semua link di situ. Tidak perlu sentuh bagian CSS ini.
     ============================================================ */

  :root{
    --bg-0:#0b0c12;
    --bg-1:#141327;
    --bg-2:#1a2230;
    --bg-3:#221a2c;
    --surface: rgba(255,255,255,0.055);
    --surface-strong: rgba(255,255,255,0.09);
    --border: rgba(255,255,255,0.14);
    --border-soft: rgba(255,255,255,0.08);
    --text-0:#eceaf5;
    --text-1:#b7b3c9;
    --text-2:#817d92;
    --accent:#9c93d1;
    --accent-soft: rgba(156,147,209,0.35);
    --ring-a:#9c93d1;
    --ring-b:#6f9c9a;
    --radius-card: 26px;
    --radius-pill: 999px;
    --shadow-deep: 0 30px 80px -25px rgba(0,0,0,0.65);
  }

  *{ box-sizing:border-box; }

  html{
    height:100%;
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }

  body{
    margin:0;
    min-height:100%;
    background: var(--bg-0);
    color: var(--text-0);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    padding: max(28px, env(safe-area-inset-top, 0px)) 20px max(28px, env(safe-area-inset-bottom, 0px));
    position:relative;
  }

  /* ---------- animated aesthetic background ---------- */

  .bg{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    background: var(--bg-0);
  }

  .bg::before{
    content:"";
    position:absolute;
    inset:-10%;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.35) 0, transparent 60%),
      radial-gradient(1px 1px at 70% 65%, rgba(255,255,255,0.25) 0, transparent 60%),
      radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.2) 0, transparent 60%),
      radial-gradient(1px 1px at 85% 20%, rgba(255,255,255,0.3) 0, transparent 60%),
      radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,0.18) 0, transparent 60%),
      radial-gradient(1px 1px at 10% 60%, rgba(255,255,255,0.22) 0, transparent 60%);
    background-repeat: repeat;
    background-size: 340px 340px;
    opacity:0.5;
  }

  .blob{
    position:absolute;
    border-radius:50%;
    filter: blur(90px);
    opacity:0.55;
    will-change: transform;
  }
  .blob.b1{
    width:52vmax; height:52vmax;
    left:-18vmax; top:-16vmax;
    background: radial-gradient(circle at 30% 30%, var(--bg-1), transparent 70%);
    animation: drift1 34s ease-in-out infinite;
  }
  .blob.b2{
    width:46vmax; height:46vmax;
    right:-14vmax; top:8vmax;
    background: radial-gradient(circle at 60% 40%, var(--bg-3), transparent 70%);
    animation: drift2 40s ease-in-out infinite;
  }
  .blob.b3{
    width:50vmax; height:50vmax;
    left:12vmax; bottom:-22vmax;
    background: radial-gradient(circle at 50% 50%, var(--bg-2), transparent 70%);
    animation: drift3 46s ease-in-out infinite;
  }

  @keyframes drift1{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(6vmax, 5vmax) scale(1.08); }
  }
  @keyframes drift2{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-5vmax, 6vmax) scale(1.1); }
  }
  @keyframes drift3{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(4vmax, -6vmax) scale(1.06); }
  }

  .grain{
    position:absolute;
    inset:0;
    opacity:0.05;
    mix-blend-mode: overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* ---------- card wrapper (perspective for tilt) ---------- */

  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width:400px;
    perspective: 1200px;
  }

  .card{
    position:relative;
    width:100%;
    padding:38px 28px 30px;
    border-radius: var(--radius-card);
    background: var(--surface);
    border:1px solid var(--border);
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    box-shadow: var(--shadow-deep), inset 0 1px 0 rgba(255,255,255,0.06);
    transform-style: preserve-3d;
    transition: transform 500ms cubic-bezier(.22,1,.36,1);
    will-change: transform;
  }

  .card::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius: inherit;
    background: linear-gradient(155deg, rgba(255,255,255,0.10), transparent 40%);
    pointer-events:none;
  }

  .card-inner{
    transform: translateZ(30px);
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  /* ---------- avatar ---------- */

  .avatar-wrap{
    position:relative;
    width:96px; height:96px;
    margin-bottom:18px;
  }

  .avatar-ring{
    position:absolute;
    inset:-5px;
    border-radius:50%;
    background: conic-gradient(from 0deg, var(--ring-a), var(--ring-b), var(--ring-a));
    animation: spin 9s linear infinite;
    filter: blur(0.3px);
  }

  @keyframes spin{ to{ transform: rotate(360deg); } }

  .avatar{
    position:relative;
    width:96px; height:96px;
    border-radius:50%;
    overflow:hidden;
    border: 3px solid var(--bg-0);
    background: var(--bg-2);
    display:block;
  }
  .avatar img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }

  /* ---------- identity ---------- */

  .name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:22px;
    letter-spacing:-0.01em;
    color: var(--text-0);
    margin:0;
  }

  .username{
    font-size:14px;
    color: var(--text-2);
    margin: 4px 0 0;
  }

  .tagline{
    font-size:13.5px;
    line-height:1.5;
    color: var(--text-1);
    margin: 14px 0 0;
    max-width: 280px;
  }

  /* ---------- social row ---------- */

  .socials{
    display:flex;
    gap:12px;
    margin-top:22px;
    flex-wrap:wrap;
    justify-content:center;
  }

  .social-btn{
    width:42px; height:42px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--surface-strong);
    border:1px solid var(--border-soft);
    color: var(--text-0);
    text-decoration:none;
    transition: transform 220ms ease, background 220ms ease, border-color 220ms ease;
  }
  .social-btn svg{ width:18px; height:18px; }
  .social-btn:hover{
    transform: translateY(-3px);
    background: rgba(156,147,209,0.16);
    border-color: var(--accent-soft);
  }
  .social-btn:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  /* ---------- divider ---------- */

  .divider{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    margin: 26px 0 16px;
    color: var(--text-2);
    font-size:12px;
  }
  .divider .line{
    flex:1;
    height:1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
  }

  /* ---------- store links ---------- */

  .stores{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .store-link{
    display:flex;
    align-items:center;
    gap:13px;
    width:100%;
    padding:12px 14px;
    border-radius:16px;
    background: var(--surface);
    border:1px solid var(--border-soft);
    text-decoration:none;
    color: var(--text-0);
    transition: transform 220ms ease, background 220ms ease, border-color 220ms ease;
  }
  .store-link:hover{
    transform: translateY(-2px);
    background: var(--surface-strong);
    border-color: var(--accent-soft);
  }
  .store-link:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  .store-icon{
    width:36px; height:36px;
    flex:0 0 auto;
    border-radius:11px;
    background: rgba(255,255,255,0.06);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .store-icon svg{ width:18px; height:18px; }

  .store-text{
    display:flex;
    flex-direction:column;
    text-align:left;
    min-width:0;
  }
  .store-title{
    font-size:14px;
    font-weight:500;
    color: var(--text-0);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .store-sub{
    font-size:12px;
    color: var(--text-2);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .store-arrow{
    margin-left:auto;
    flex:0 0 auto;
    color: var(--text-2);
    transition: transform 220ms ease, color 220ms ease;
  }
  .store-link:hover .store-arrow{
    transform: translateX(3px);
    color: var(--text-0);
  }

  footer.credit{
    margin-top:22px;
    text-align:center;
    font-size:11.5px;
    color: var(--text-2);
    position:relative;
    z-index:1;
  }

  @media (max-width:380px){
    .card{ padding:32px 20px 24px; }
  }

  @media (prefers-reduced-motion: reduce){
    .blob{ animation:none; }
    .avatar-ring{ animation:none; }
    .card{ transition:none; }
  }
</style>
</head>
<body>

  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="grain"></div>
  </div>

  <div class="stage">
    <div class="card" id="card">
      <div class="card-inner">
        <div class="avatar-wrap">
          <div class="avatar-ring"></div>
          <div class="avatar">
            <img id="avatarImg" src="" alt="Foto profil">
          </div>
        </div>

        <h1 class="name" id="nameText"></h1>
        <p class="username" id="usernameText"></p>
        <p class="tagline" id="taglineText"></p>

        <div class="socials" id="socialRow"></div>

        <div class="divider"><span class="line"></span><span id="dividerLabel">Proyek &amp; toko</span><span class="line"></span></div>

        <div class="stores" id="storeList"></div>
      </div>
    </div>

    <footer class="credit" id="creditText"></footer>
  </div>

<script>
/* ================================================================
   GANTI SEMUA DATA DI SINI. Ini satu-satunya bagian yang perlu
   kamu edit — layout & animasi otomatis menyesuaikan.

   - image: taruh link Cloudinary foto profil kamu
   - socials/stores: "icon" pilih dari daftar ICONS di bawah script
     ini (discord, website, instagram, tiktok, twitter, youtube,
     github, whatsapp, telegram, generic). Kalau tidak ada yang
     cocok, pakai "generic".
================================================================= */

const CONFIG = {
  profile: {
    image: "https://res.cloudinary.com/dnpvgpqka/image/upload/v1790072788/IMG_20260922_172611_dgeuey.jpg",
    name: "Sevanniks",
    username: "@nikstry_",
    tagline: "Developer • Bot & Store Owner"
  },
  socials: [
    { icon: "discord",  label: "Discord",  url: "https://discord.com/users/1393969289618260085" },
    { icon: "instagram",label: "Instagram",url: "https://instagram.com/niksstry_" },
    { icon: "github",   label: "GitHub",   url: "https://github.com/AnB129" },
    { icon: "website",  label: "Website",  url: "https://doominiksstore.xyz" }
  ],
stores: [
  {
    icon: "discord",
    title: "Noctra Digital Store",
    subtitle: "Gabung server Discord",
    url: "https://discord.gg/n69UvY5ccg"
  },
  {
    icon: "website",
    title: "Doominiks Store",
    subtitle: "website gaming store",
    url: "https://doominiksstore.xyz"
  }
],
  dividerLabel: "Proyek & toko",
  credit: "© 2020 Niksoliesamphink" // isi contoh: "" — kosongkan kalau tidak perlu
};

/* ================================================================
   Dari sini ke bawah adalah logika render + animasi.
   Tidak wajib diubah.
================================================================= */

const ICONS = {
  discord: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.3 5.3A17.5 17.5 0 0 0 15.9 4l-.2.4a12.6 12.6 0 0 1 3.7 1.9 15.9 15.9 0 0 0-14.8 0 12.6 12.6 0 0 1 3.7-1.9L8.1 4a17.5 17.5 0 0 0-4.4 1.3C1.4 9 .7 12.6 1 16.1a17.6 17.6 0 0 0 5.3 2.7l.7-1.1a11.4 11.4 0 0 1-1.9-.9l.5-.4a12.6 12.6 0 0 0 10.8 0l.5.4a11.4 11.4 0 0 1-1.9.9l.7 1.1a17.6 17.6 0 0 0 5.3-2.7c.4-4-.6-7.5-2.7-10.8ZM8.9 14c-.8 0-1.5-.8-1.5-1.7 0-1 .6-1.7 1.5-1.7s1.5.8 1.5 1.7-.6 1.7-1.5 1.7Zm6.2 0c-.8 0-1.5-.8-1.5-1.7 0-1 .6-1.7 1.5-1.7s1.5.8 1.5 1.7-.6 1.7-1.5 1.7Z"/></svg>`,
  website: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9s1.3-6.4 3.8-9Z"/></svg>`,
  instagram: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>`,
  tiktok: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.5 3c.3 1.9 1.6 3.3 3.6 3.6v2.6a6.6 6.6 0 0 1-3.6-1.1v6.4a5.1 5.1 0 1 1-4.4-5v2.7a2.4 2.4 0 1 0 1.8 2.3V3h2.6Z"/></svg>`,
  twitter: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4l7.3 9.6L4.4 20H6l6-6.6L16.7 20H20l-7.7-10L19.6 4H18l-5.5 6L8.3 4H4Z"/></svg>`,
  youtube: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10.5 9.5l5 2.5-5 2.5v-5Z" fill="currentColor" stroke="none"/></svg>`,
  github: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.4-1.1-1-1.4-1-1.4-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.5-1.3.1-2.7 0 0 .8-.3 2.7 1a9.4 9.4 0 0 1 5 0c1.9-1.3 2.7-1 2.7-1 .6 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.4 4.7-4.6 5 .4.3.7 1 .7 2v2.9c0 .3.2.6.7.5A10 10 0 0 0 12 2Z"/></svg>`,
  whatsapp: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2Zm0 18.2a8.1 8.1 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1s-.7.8-.9 1c-.1.2-.3.2-.6.1a6.6 6.6 0 0 1-3.3-2.9c-.2-.4.2-.4.6-1.2.1-.1.1-.3 0-.4l-.7-1.7c-.2-.4-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-1 1-1 2.3s1 2.7 1.1 2.9c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>`,
  telegram: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 3.5 2.7 11c-.9.4-.9 1.6.1 1.9l4.4 1.4 1.7 5.3c.2.6 1 .8 1.4.3l2.4-2.6 4.6 3.4c.7.5 1.7.1 1.9-.7l3-15c.2-1-.8-1.8-1.7-1.5ZM8.4 13.6l9-6.2c.3-.2.6.2.3.4l-7.4 7.1c-.3.3-.5.7-.5 1.1l-.2 2.2-1.2-4.6Z"/></svg>`,
  generic: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l2-2a4.5 4.5 0 1 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-2 2a4.5 4.5 0 1 0 6.4 6.4l1-1"/></svg>`
};

function iconSVG(key){
  return ICONS[key] || ICONS.generic;
}

function render(){
  document.getElementById('avatarImg').src = CONFIG.profile.image;
  document.getElementById('avatarImg').alt = CONFIG.profile.name || "Foto profil";
  document.getElementById('nameText').textContent = CONFIG.profile.name;
  document.getElementById('usernameText').textContent = CONFIG.profile.username;
  document.getElementById('taglineText').textContent = CONFIG.profile.tagline || "";
  document.getElementById('dividerLabel').textContent = CONFIG.dividerLabel || "Proyek & toko";

  const socialRow = document.getElementById('socialRow');
  socialRow.innerHTML = "";
  (CONFIG.socials || []).forEach(s => {
    const a = document.createElement('a');
    a.className = "social-btn";
    a.href = s.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.setAttribute('aria-label', s.label || s.icon);
    a.title = s.label || "";
    a.innerHTML = iconSVG(s.icon);
    socialRow.appendChild(a);
  });

  const storeList = document.getElementById('storeList');
  storeList.innerHTML = "";
  (CONFIG.stores || []).forEach(s => {
    const a = document.createElement('a');
    a.className = "store-link";
    a.href = s.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.innerHTML = `
      <span class="store-icon">${iconSVG(s.icon)}</span>
      <span class="store-text">
        <span class="store-title"></span>
        <span class="store-sub"></span>
      </span>
      <span class="store-arrow" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 6l6 6-6 6"/>
        </svg>
      </span>`;
    a.querySelector('.store-title').textContent = s.title;
    a.querySelector('.store-sub').textContent = s.subtitle || "";
    storeList.appendChild(a);
  });

  if (CONFIG.credit) {
    document.getElementById('creditText').textContent = CONFIG.credit;
  }
}

render();

/* ---------- tilt on pointer move / drag ---------- */

const card = document.getElementById('card');
const stage = document.querySelector('.stage');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let rect = null;
let raf = null;

function updateTilt(clientX, clientY){
  if (!rect) rect = stage.getBoundingClientRect();
  const px = (clientX - rect.left) / rect.width;
  const py = (clientY - rect.top) / rect.height;
  const rotY = (px - 0.5) * 16;
  const rotX = (0.5 - py) * 16;

  if (raf) cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    card.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
  });
}

function resetTilt(){
  if (raf) cancelAnimationFrame(raf);
  card.style.transform = "rotateX(0deg) rotateY(0deg)";
}

if (!reduceMotion){
  window.addEventListener('resize', () => { rect = null; });

  stage.addEventListener('pointermove', (e) => {
    updateTilt(e.clientX, e.clientY);
  });
  stage.addEventListener('pointerleave', resetTilt);

  stage.addEventListener('touchmove', (e) => {
    if (e.touches && e.touches[0]) {
      updateTilt(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });
  stage.addEventListener('touchend', resetTilt);
}
</script>
</body>
</html>
